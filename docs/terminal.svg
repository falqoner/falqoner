<text x="345.5" y="20.5" text-anchor="middle" fill="#7d8699" font-size="11.5">falconer — post-quantum authority</text>
<clipPath id="view"><rect x="0" y="33" width="691" height="403"/></clipPath>
<g clip-path="url(#view)"><g class="loop-fade"><g class="scroller">
<text class="l0" x="18" y="56"></text>
<text class="l1" x="18" y="75"><tspan fill="#7d8699">  # Fixture ledger: fixed records answering for LocalNet. No node, no</tspan></text>
<text class="l2" x="18" y="94"><tspan fill="#7d8699">  # network, not live data. npm run demo -- --live reads MainNet instead.</tspan></text>
<text class="l3" x="18" y="113"></text>
<text class="l4" x="18" y="132"><tspan fill="#7d8699">  # 1. Authority, not balance: scan reports roles beyond the balance.</tspan></text>
<text class="l5" x="18" y="151"><tspan fill="#7d8699">  # In the fixture this account holds 0.3 ALGO and manages asset 7001.</tspan></text>
<text class="l6" x="18" y="170"></text>
<text class="l7" x="18" y="189"><tspan fill="#79c0ff">  $ falconer scan CSETLP27ZYRABTR5E6HUAWNSWGEHYHCLB56OFF64E6TW7ZHS3RJLCR2CNE \</tspan></text>
<text class="l8" x="18" y="208"><tspan fill="#79c0ff">      --assets 7001 --compact --network localnet</tspan></text>
<text class="l9" x="18" y="227"></text>
<text class="l10" x="18" y="246"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">account</tspan><tspan fill="#c9d1d9">    </tspan><tspan fill="#c9d1d9" font-weight="600">CSETLP27ZYRABTR5E6HUAWNSWGEHYHCLB56OFF64E6TW7ZHS3RJLCR2CNE</tspan></text>
<text class="l11" x="18" y="265"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">balance</tspan><tspan fill="#c9d1d9">    0.3 ALGO</tspan></text>
<text class="l12" x="18" y="284"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">authority</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff5964">classical, by address shape: on the Ed25519 curve</tspan></text>
<text class="l13" x="18" y="303"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">basis    </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">address shape only; account type not observed</tspan></text>
<text class="l14" x="18" y="322"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">risk</tspan><tspan fill="#c9d1d9">       </tspan><tspan fill="#ff9f43" font-weight="600"> 55</tspan><tspan fill="#7d8699">/100</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff9f43">High exposure</tspan></text>
<text class="l15" x="18" y="341"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">coverage </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#3ddc84">complete for the checks run</tspan></text>
<text class="l16" x="18" y="360"></text>
<text class="l17" x="18" y="379"><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">Findings</tspan></text>
<text class="l18" x="18" y="398"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff5964">▲</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ff5964">critical</tspan><tspan fill="#c9d1d9"> Manager of FXD</tspan></text>
<text class="l19" x="18" y="417"></text>
<text class="l20" x="18" y="436"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff5964">!</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ff5964">This address can seize 1 asset from any holder. Those roles are</tspan></text>
<text class="l21" x="18" y="455"><tspan fill="#c9d1d9">    </tspan><tspan fill="#ff5964">exercised under this account's own authority, which is not</tspan></text>
<text class="l22" x="18" y="474"><tspan fill="#c9d1d9">    </tspan><tspan fill="#ff5964">established as post-quantum. Breaking the exposed key would reach</tspan></text>
<text class="l23" x="18" y="493"><tspan fill="#c9d1d9">    </tspan><tspan fill="#ff5964">beyond this account.</tspan></text>
<text class="l24" x="18" y="512"></text>
<text class="l25" x="18" y="531"><tspan fill="#7d8699">  exit 0: report printed</tspan></text>
<text class="l26" x="18" y="550"></text>
<text class="l27" x="18" y="569"><tspan fill="#7d8699">  # 2. Record, not shape: verify names an authority only from a confirmed record.</tspan></text>
<text class="l28" x="18" y="588"><tspan fill="#7d8699">  # In the fixture: a 2-of-3 multisig address, with one confirmed record.</tspan></text>
<text class="l29" x="18" y="607"></text>
<text class="l30" x="18" y="626"><tspan fill="#79c0ff">  $ falconer verify WIYMIKTJUQR3PE4HXJVM64WWOHFUMMPAJVZ3JYPLUGF2ZRYUWEOHNGE22E \</tspan></text>
<text class="l31" x="18" y="645"><tspan fill="#79c0ff">      --compact --network localnet</tspan></text>
<text class="l32" x="18" y="664"></text>
<text class="l33" x="18" y="683"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">account</tspan><tspan fill="#c9d1d9">    WIYMIKTJUQR3PE4HXJVM64WWOHFUMMPAJVZ3JYPLUGF2ZRYUWEOHNGE22E</tspan></text>
<text class="l34" x="18" y="702"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">authority</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff5964">classical multisignature, on a provider-confirmed record</tspan></text>
<text class="l35" x="18" y="721"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">evidence   </tspan><tspan fill="#c9d1d9">tx/FIXTUREMULTISIGAAAAAAAAAAAAAAAAAAAAA...</tspan></text>
<text class="l36" x="18" y="740"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">verdict</tspan><tspan fill="#c9d1d9">    </tspan><tspan fill="#ff5964">✖ not established as post-quantum</tspan></text>
<text class="l37" x="18" y="759"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">basis    </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">confirmed record</tspan></text>
<text class="l38" x="18" y="778"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">         </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">FIXTUREMULTISIGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA in round</tspan></text>
<text class="l39" x="18" y="797"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">         </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">42, reported by the localnet indexer; signature bytes not</tspan></text>
<text class="l40" x="18" y="816"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">         </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8699">verified by Falconer</tspan></text>
<text class="l41" x="18" y="835"></text>
<text class="l42" x="18" y="854"><tspan fill="#7d8699">  exit 2: not established as post-quantum</tspan></text>
</g></g></g>
</svg>
